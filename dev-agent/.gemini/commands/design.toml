description = "Create reference-driven UX, visual system, screen acceptance, and formal design handoff"

prompt = """
Invoke the design-flow skill.

Before implementation planning:

1. Read the approved spec, references, existing UI, and project context.
2. State assumptions, plausible interpretations, tradeoffs, and any blocker that needs user input.
3. Run `bin/dev-flow reference-check <project-name> --required`, or `--delegated` only when the user delegated visual direction.
4. Produce `DESIGN.md`, `VISUAL_SYSTEM.md`, and `SCREEN_ACCEPTANCE.md`.
5. Satisfy `dev-agent/references/design-artifacts.md`: formal approved raster/PDF/Figma exports, AI-image HTML companions when applicable, Figma handoff when used, and a cut-asset manifest. SVG files under `design/cut-assets/` are allowed only as manifested element/runtime assets, not screen layout references.
6. Run `bin/dev-flow design-check <project-name>` and fix failures before plan or build.

Use `asset-check` or `figma-check` separately only for focused diagnostics or evidence.
"""

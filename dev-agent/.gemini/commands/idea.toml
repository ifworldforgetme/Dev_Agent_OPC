description = "Refine a rough idea into a focused product or engineering brief"
prompt = "---\ndescription: Refine a rough idea into a focused product or engineering brief\n---\n\nInvoke the `idea-refine` skill.\n\nTurn the rough request into a project brief before writing specs or code:\n\n1. Identify target users, jobs to be done, and the concrete outcome.\n2. Preserve a lightweight requirement attribution table: user-stated inputs, agent inferences, product decisions, and open confirmations.\n3. Separate must-have scope from optional exploration.\n4. Capture constraints, non-goals, risks, and open questions.\n5. For customer-facing apps, ask for reference images, reference software, links, screenshots, or Figma files when visual direction is not already delegated.\n6. Save the result under `<project-name>/ideas/idea-brief.md`.\n\nDo not jump to implementation from this phase.\n"

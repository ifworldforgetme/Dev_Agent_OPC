description = "Review security-sensitive behavior before implementation or launch"
prompt = "---\ndescription: Review security-sensitive behavior before implementation or launch\n---\n\nInvoke the `security-and-hardening` skill.\n\nUse this for auth, permissions, payments, data deletion, secrets, uploads, external integrations, and production launch risk:\n\n1. Identify assets, actors, trust boundaries, and abuse cases.\n2. Check input validation, authorization, secret handling, data retention, and logging.\n3. Review dependency and configuration risks.\n4. Add tests or verification steps for high-risk paths.\n5. Report blockers separately from recommendations.\n\nSecurity blockers must be fixed or explicitly accepted by the user before launch.\n"

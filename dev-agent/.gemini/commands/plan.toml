description = "Break approved work into small verifiable tasks"

prompt = """
Invoke the planning-and-task-breakdown skill.

Read the approved spec and, for UI work, the design artifacts. Plan without editing production code:

1. State assumptions, alternative interpretations, tradeoffs, and open blockers.
2. Identify source boundaries, dependencies, and the simplest viable implementation path.
3. Slice work vertically into small deliverable tasks with acceptance criteria and verification commands.
4. Add human checkpoints only for named review gates or high-risk decisions.
5. Save `work/<project-name>/tasks/PLAN.md`.
6. For UI work, save `tasks/IMPLEMENTATION_TRACE.md` using the schema in `dev-agent/templates/project/implementation-trace.md`.
7. Update `tasks/PDCA.md` Current Cycle and Plan with scope, objective, source artifacts, acceptance criteria, and quality gates.

Use project-local paths such as `work/<project-name>/apps/mobile/...`.
"""

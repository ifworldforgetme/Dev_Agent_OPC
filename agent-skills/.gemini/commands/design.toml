description = "Create UX, interaction, and visual design requirements before implementation planning"

prompt = """
Invoke the design-flow skill.

Read the approved spec under `work/<project-name>/specs/` and inspect existing app screens/components if they exist. Then:

1. Define the UX problem and success criteria
2. Compare interaction approaches and choose a recommendation
3. Apply iOS, Android, accessibility, privacy, and HCI principles
4. Define information architecture, navigation, screen hierarchy, states, and interaction model
5. Define visual direction: icon, palette, typography, spacing, cards, buttons, motion, and gestures
6. If visual artifacts are useful, use the installed imagegen skill and save project-bound outputs under `work/<project-name>/design/`

Save the design package under `work/<project-name>/design/` and update the spec or task plan references before implementation planning.
"""

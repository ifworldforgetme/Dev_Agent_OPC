description = "Create reference-driven UX, interaction, visual system, and screen acceptance requirements before implementation planning"

prompt = """
Invoke the design-flow skill.

Read the approved spec under `work/<project-name>/specs/`, inspect references under `work/<project-name>/design/`, and inspect existing app screens/components if they exist. For customer-facing UI, run `bin/dev-flow reference-check <project-name> --required` when available. If the user explicitly delegates visual direction, run `bin/dev-flow reference-check <project-name> --delegated` instead. Then:

1. Define the UX problem and success criteria
2. Extract concrete patterns from provided references or ask for references if visual direction is not delegated
3. Compare interaction approaches and choose a recommendation
4. Apply iOS, Android, accessibility, privacy, and HCI principles
5. Define information architecture, navigation, screen hierarchy, states, and interaction model
6. Define visual direction: icon, palette, typography, spacing, cards, buttons, motion, and gestures
7. Derive the required screen list from the PRD, spec, design, and interaction model, then define each as a `##` section in `SCREEN_ACCEPTANCE.md` with key states and breakpoints
8. If helpful, create deterministic SVG/Mermaid/Markdown layout drafts for structure, then render or screenshot them and use them as imagegen references
9. Use the installed imagegen skill to generate 1-N high-fidelity raster/PDF layout and state boards for every `SCREEN_ACCEPTANCE.md` screen before implementation planning
10. Save prompts and coverage in `imagegen-prompts.md`, with at least one row for each exact `SCREEN_ACCEPTANCE.md` screen heading pointing to a project-local final raster/PDF board under `design/imagegen/`. Save selected boards in `design/imagegen/`, and any bitmap cut assets in `design/cut-assets/`. Do not treat SVG drafts alone as final imagegen boards

Save `DESIGN.md`, `VISUAL_SYSTEM.md`, `SCREEN_ACCEPTANCE.md`, and `imagegen-prompts.md` under `work/<project-name>/design/`. Run `bin/dev-flow design-check <project-name>` when available, then update spec or task plan references before implementation planning.
"""

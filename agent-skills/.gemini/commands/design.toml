description = "Create reference-driven UX, interaction, visual system, and screen acceptance requirements before implementation planning"

prompt = """
Invoke the design-flow skill.

Read the approved spec under `work/<project-name>/specs/`, inspect references under `work/<project-name>/design/`, and inspect existing app screens/components if they exist. For customer-facing UI, run `bin/dev-flow reference-check <project-name> --required` when available. Then:

1. Define the UX problem and success criteria
2. Extract concrete patterns from provided references or ask for references if visual direction is not delegated
3. Compare interaction approaches and choose a recommendation
4. Apply iOS, Android, accessibility, privacy, and HCI principles
5. Define information architecture, navigation, screen hierarchy, states, and interaction model
6. Define visual direction: icon, palette, typography, spacing, cards, buttons, motion, and gestures
7. Define screen acceptance criteria for key states and breakpoints
8. Use the installed imagegen skill to generate 1-N layout and state images for every customer-facing screen before implementation planning
9. Save prompts and coverage in `imagegen-prompts.md`, selected boards in `design/imagegen/`, and any bitmap cut assets in `design/cut-assets/`

Save `DESIGN.md`, `VISUAL_SYSTEM.md`, `SCREEN_ACCEPTANCE.md`, and `imagegen-prompts.md` under `work/<project-name>/design/`. Run `bin/dev-flow design-check <project-name>` when available, then update spec or task plan references before implementation planning.
"""

description = "Run Dev Agent through the visible /dev agent entrypoint"

prompt = """
Use this as `/dev agent <action> ...`.

Compatibility alias: `/dev-agent <action> ...`.

Stable ID: `dev-agent`.

Actions:

- `flow <flow-name> [project-name]`: read the matching command with `bin/dev-flow command <flow-name>`, invoke its required skill, write outputs under `work/<project-name>/`, run the command's gate, and record the next phase after the gate passes.
- `role <role-name> [task]`: read the matching persona with `bin/dev-flow agent <role-name>`.
- `next <project-name>`: run `bin/dev-flow status <project-name>` and `bin/dev-flow next <project-name>`.
- `check <gate-name> <project-name> [phase-or-options]`: run the matching executable gate.

Supported flows: `idea`, `pm`, `agent`, `spec`, `design`, `figma-design`, `figma-library`, `plan`, `build`, `test`, `review`, `ship`, `debug`, `ui`, `api`, `security`, `code-simplify`.

Supported roles: `code-reviewer`, `product-designer`, `security-auditor`, `test-engineer`, `ui-quality-reviewer`.

Resolve actions, flows, roles, and gates from `agent-skills/dev-agent.manifest.json`. Prefer project-local `bin/dev-flow`; otherwise use the installed `dev-agent-runtime/bin/dev-flow`.
"""
